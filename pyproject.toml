[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sampler-scope"
version = "0.1.0"
description = "Exact decoder attribution in finite language-agent environments."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
model = [
    "torch>=2.2",
    "transformers>=4.45",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[project.scripts]
sampler-scope = "samplerscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
